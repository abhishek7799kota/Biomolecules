<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Biomolecules Quiz App</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 80%;
      max-width: 800px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .question {
      font-size: 22px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .option {
      background: #eee;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .option:hover {
      background: #dcdcdc;
    }

    .correct {
      background: green !important;
      color: white;
    }

    .wrong {
      background: red !important;
      color: white;
    }

    #nextBtn {
      margin-top: 20px;
      padding: 12px 20px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      display: none;
    }

    #nextBtn:hover {
      background: #0056b3;
    }

    #score {
      text-align: center;
      font-size: 24px;
      margin-top: 20px;
      font-weight: bold;
      color: green;
    }
  </style>
</head>
<body>

  <div class="container">

    <h1>Biomolecules Quiz App</h1>

    <div id="quiz"></div>

    <button id="nextBtn">Next Question</button>

    <div id="score"></div>

  </div>

  <script>

    let questions = [];
    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    const quiz = document.getElementById("quiz");
    const nextBtn = document.getElementById("nextBtn");
    const scoreDiv = document.getElementById("score");

    // Load JSON File
    fetch("biomolecules_questions.json")
      .then(response => {
        if (!response.ok) {
          throw new Error("JSON file not found");
        }
        return response.json();
      })
      .then(data => {

        questions = [...data.part1, ...data.part2];

        loadQuestion();

      })
      .catch(error => {

        console.error(error);

        quiz.innerHTML = `
          <h2 style="color:red;">
            Error Loading JSON File
          </h2>
        `;
      });

    function loadQuestion() {

      answered = false;
      nextBtn.style.display = "none";

      if (currentQuestion >= questions.length) {
        showScore();
        return;
      }

      const q = questions[currentQuestion];

      quiz.innerHTML = `
        <div class="question">
          Q${currentQuestion + 1}. ${q.question}
        </div>

        <div id="options"></div>
      `;

      const optionsDiv = document.getElementById("options");

      q.options.forEach(option => {

        const btn = document.createElement("div");

        btn.classList.add("option");

        btn.innerText = option;

        btn.addEventListener("click", () => {
          checkAnswer(btn, option, q.answer);
        });

        optionsDiv.appendChild(btn);

      });

    }

    function checkAnswer(selectedBtn, selectedOption, correctAnswer) {

      if (answered) return;

      answered = true;

      const options = document.querySelectorAll(".option");

      options.forEach(option => {

        if (option.innerText === correctAnswer) {
          option.classList.add("correct");
        }

      });

      if (selectedOption === correctAnswer) {

        score++;

      } else {

        selectedBtn.classList.add("wrong");

      }

      nextBtn.style.display = "block";

    }

    nextBtn.addEventListener("click", () => {

      currentQuestion++;

      loadQuestion();

    });

    function showScore() {

      quiz.innerHTML = `
        <h2>Quiz Completed!</h2>
      `;

      nextBtn.style.display = "none";

      scoreDiv.innerHTML = `
        Your Score: ${score} / ${questions.length}
      `;

    }

  </script>

</body>
</html>
